<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: "Poppins", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff758c, #ff7eb3, #8e44ad);
        }

        .container {
            position: relative;
            width: 90%;
            max-width: 700px;
            padding: 45px 25px;
            text-align: center;
            color: white;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
            z-index: 2;
        }

        .cake {
            font-size: 75px;
            animation: bounce 1.5s infinite;
        }

        h1 {
            margin: 15px 0;
            font-size: 48px;
            color: #fff;
            text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.25);
        }

        h2 {
            font-size: 30px;
            color: #ffe66d;
            margin-bottom: 18px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        button {
            padding: 13px 28px;
            border: none;
            border-radius: 30px;
            background: #ffe66d;
            color: #7b2cbf;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: scale(1.08);
            background: #ffffff;
        }

        #message {
            display: none;
            margin-top: 25px;
            font-size: 22px;
            color: #fff;
            animation: fadeIn 1s ease;
        }

        .balloon {
            position: absolute;
            bottom: -120px;
            width: 55px;
            height: 70px;
            border-radius: 50%;
            animation: fly 9s linear infinite;
        }

        .balloon::after {
            content: "";
            position: absolute;
            width: 2px;
            height: 80px;
            background: white;
            top: 68px;
            left: 27px;
        }

        .balloon1 {
            left: 8%;
            background: #ff4d6d;
            animation-delay: 1s;
        }

        .balloon2 {
            left: 28%;
            background: #ffd166;
            animation-delay: 3s;
        }

        .balloon3 {
            right: 25%;
            background: #06d6a0;
            animation-delay: 5s;
        }

        .balloon4 {
            right: 7%;
            background: #4cc9f0;
            animation-delay: 2s;
        }

        .sparkle {
            position: absolute;
            color: white;
            font-size: 25px;
            animation: sparkle 2s infinite alternate;
        }

        .sparkle1 {
            top: 12%;
            left: 12%;
        }

        .sparkle2 {
            top: 20%;
            right: 12%;
            animation-delay: 0.5s;
        }

        .sparkle3 {
            bottom: 15%;
            left: 18%;
            animation-delay: 1s;
        }

        .sparkle4 {
            bottom: 20%;
            right: 15%;
            animation-delay: 1.5s;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        @keyframes fly {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(-120vh) rotate(20deg);
                opacity: 0;
            }
        }

        @keyframes sparkle {
            from {
                transform: scale(0.7);
                opacity: 0.4;
            }

            to {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 36px;
            }

            h2 {
                font-size: 24px;
            }

            p {
                font-size: 16px;
            }

            .cake {
                font-size: 60px;
            }
        }
    </style>
</head>

<body>

    <div class="balloon balloon1"></div>
    <div class="balloon balloon2"></div>
    <div class="balloon balloon3"></div>
    <div class="balloon balloon4"></div>

    <div class="sparkle sparkle1">✨</div>
    <div class="sparkle sparkle2">⭐</div>
    <div class="sparkle sparkle3">✨</div>
    <div class="sparkle sparkle4">⭐</div>

    <div class="container">
        <div class="cake">🎂</div>

        <h1>Happy Birthday!</h1>

        <!-- Change the name here -->
        <h2>Dear Special Friend 🎉</h2>

        <p>
            May your birthday be filled with happiness, love, laughter,
            and beautiful memories. May all your dreams come true!
        </p>

        <button onclick="showMessage()">Click for a Surprise 🎁</button>

        <div id="message">
            🎊 You are truly special! Have an amazing birthday! 🎊
        </div>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").style.display = "block";

            for (let i = 0; i < 80; i++) {
                createConfetti();
            }
        }

        function createConfetti() {
            const confetti = document.createElement("div");

            confetti.innerHTML = "🎉";
            confetti.style.position = "fixed";
            confetti.style.left = Math.random() * 100 + "vw";
            confetti.style.top = "-30px";
            confetti.style.fontSize = Math.random() * 20 + 15 + "px";
            confetti.style.zIndex = "5";
            confetti.style.animation = "fall 3s linear forwards";

            document.body.appendChild(confetti);

            setTimeout(() => {
                confetti.remove();
            }, 3000);
        }

        const style = document.createElement("style");

        style.innerHTML = `
            @keyframes fall {
                to {
                    transform: translateY(110vh) rotate(720deg);
                    opacity: 0;
                }
            }
        `;

        document.head.appendChild(style);
    </script>

</body>
</html>
